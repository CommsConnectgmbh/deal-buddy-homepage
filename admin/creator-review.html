<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DealBuddy – Admin Creator Review</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060606; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .header { background: #111; border-bottom: 1px solid #1a1a1a; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  .header-title { color: #FFB800; font-size: 20px; font-weight: 800; }
  .header-sub { color: #555; font-size: 12px; }
  .main { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
  .filters { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .filter-btn { padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid #333; background: #111; color: #555; transition: all 0.2s; }
  .filter-btn.active { border-color: #FFB800; color: #FFB800; background: #1a1500; }
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card { background: #111; border: 1px solid #1a1a1a; border-radius: 14px; padding: 16px; text-align: center; }
  .stat-value { font-size: 28px; font-weight: 800; color: #FFB800; }
  .stat-label { color: #555; font-size: 11px; margin-top: 4px; }
  .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .review-card { background: #111; border: 1px solid #1a1a1a; border-radius: 16px; overflow: hidden; }
  .review-card.pending { border-color: #FFB80050; }
  .review-img { width: 100%; height: 200px; object-fit: contain; background: #0d0d0d; padding: 20px; }
  .review-img-placeholder { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; background: #0d0d0d; font-size: 64px; }
  .review-body { padding: 16px; }
  .review-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .review-meta { color: #555; font-size: 12px; margin-bottom: 12px; line-height: 1.8; }
  .review-desc { color: #888; font-size: 13px; margin-bottom: 14px; font-style: italic; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-right: 6px; }
  .badge-legendary { background: #FFB80020; color: #FFB800; border: 1px solid #FFB800; }
  .badge-epic { background: #a855f720; color: #a855f7; border: 1px solid #a855f7; }
  .badge-rare { background: #3b82f620; color: #3b82f6; border: 1px solid #3b82f6; }
  .badge-common { background: #9ca3af20; color: #9ca3af; border: 1px solid #9ca3af; }
  .badge-pending { background: #FFB80020; color: #FFB800; }
  .badge-approved { background: #22c55e20; color: #22c55e; }
  .badge-rejected { background: #ef444420; color: #ef4444; }
  .review-actions { display: flex; flex-direction: column; gap: 8px; }
  .price-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .price-select { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 8px; color: #fff; font-size: 13px; }
  .rarity-select { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 8px; color: #fff; font-size: 13px; }
  .note-input { width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 8px; color: #fff; font-size: 13px; margin-bottom: 8px; }
  .actions-row { display: flex; gap: 8px; }
  .btn { padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; flex: 1; }
  .btn-approve { background: #22c55e; color: #fff; }
  .btn-approve:hover { background: #16a34a; }
  .btn-reject { background: #ef4444; color: #fff; }
  .btn-reject:hover { background: #dc2626; }
  .btn-gold { background: #FFB800; color: #000; }
  .creator-tag { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #0d0d0d; border-radius: 8px; margin-bottom: 10px; }
  .creator-avatar { width: 28px; height: 28px; border-radius: 50%; background: #FFB800; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #000; }
  .creator-name { color: #888; font-size: 13px; }
  .empty { color: #444; text-align: center; padding: 60px; font-size: 14px; }
  .loading { color: #555; text-align: center; padding: 40px; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #22c55e; color: #fff; padding: 14px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; transform: translateY(100px); transition: transform 0.3s; z-index: 9999; }
  .toast.show { transform: translateY(0); }
  .toast.error { background: #ef4444; }
  #auth-overlay { position: fixed; inset: 0; background: #060606; display: flex; align-items: center; justify-content: center; z-index: 999; }
  .auth-card { background: #111; border: 2px solid #FFB800; border-radius: 20px; padding: 40px; width: 360px; text-align: center; }
  .auth-input { width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 14px; color: #fff; font-size: 15px; margin-bottom: 12px; }
  .auth-btn { width: 100%; background: #FFB800; color: #000; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<div id="auth-overlay">
  <div class="auth-card">
    <div style="font-size:48px;margin-bottom:8px">⚙️</div>
    <div style="color:#FFB800;font-size:20px;font-weight:800;margin-bottom:20px">Admin · Creator Review</div>
    <input class="auth-input" id="admin-email" type="email" placeholder="Admin E-Mail" />
    <input class="auth-input" id="admin-pw" type="password" placeholder="Passwort" />
    <button class="auth-btn" onclick="adminLogin()">Einloggen</button>
    <p id="auth-err" style="color:#ef4444;font-size:12px;margin-top:10px"></p>
  </div>
</div>

<div class="header">
  <div>
    <div class="header-title">🎨 Creator Submissions – Admin Review</div>
    <div class="header-sub">Comms Connect GmbH · Rainer Roloff</div>
  </div>
  <button onclick="db.auth.signOut().then(()=>location.reload())" style="background:#1a1a1a;border:1px solid #333;color:#555;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px">Logout</button>
</div>

<div class="main">
  <div class="stats-row" id="admin-stats">
    <div class="stat-card"><div class="stat-value" id="s-pending">–</div><div class="stat-label">⏳ Ausstehend</div></div>
    <div class="stat-card"><div class="stat-value" id="s-approved">–</div><div class="stat-label">✅ Genehmigt</div></div>
    <div class="stat-card"><div class="stat-value" id="s-rejected">–</div><div class="stat-label">❌ Abgelehnt</div></div>
    <div class="stat-card"><div class="stat-value" id="s-creators">–</div><div class="stat-label">🎨 Aktive Creator</div></div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterItems('pending', this)">⏳ Ausstehend</button>
    <button class="filter-btn" onclick="filterItems('approved', this)">✅ Genehmigt</button>
    <button class="filter-btn" onclick="filterItems('rejected', this)">❌ Abgelehnt</button>
    <button class="filter-btn" onclick="filterItems('all', this)">📋 Alle</button>
  </div>

  <div class="items-grid" id="items-grid"><div class="loading">⏳ Lade...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://vjygmfaefhkwznldegvq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqeWdtZmFlZmhrd3pubGRlZ3ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwOTg4MTAsImV4cCI6MjA4NzY3NDgxMH0.vnfOsWMFB4nQnEd5c1x5USrqUhiYBDwlEuPIAx8GkEI';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentFilter = 'pending';
let allSubmissions = [];

async function adminLogin() {
  const email = document.getElementById('admin-email').value;
  const pw = document.getElementById('admin-pw').value;
  const { data, error } = await db.auth.signInWithPassword({ email, password: pw });
  if (error) { document.getElementById('auth-err').textContent = error.message; return; }
  const { data: profile } = await db.from('profiles').select('is_admin').eq('id', data.user.id).single();
  if (!profile?.is_admin) { await db.auth.signOut(); document.getElementById('auth-err').textContent = 'Kein Admin-Zugriff.'; return; }
  document.getElementById('auth-overlay').style.display = 'none';
  loadAll();
}

async function loadAll() {
  const { data } = await db.from('creator_submissions')
    .select('*, creator:creator_profiles!creator_id(username, paypal_email)')
    .order('created_at', { ascending: false });
  allSubmissions = data || [];
  updateStats();
  renderItems(currentFilter);
}

function updateStats() {
  document.getElementById('s-pending').textContent = allSubmissions.filter(i => i.status === 'pending').length;
  document.getElementById('s-approved').textContent = allSubmissions.filter(i => i.status === 'approved').length;
  document.getElementById('s-rejected').textContent = allSubmissions.filter(i => i.status === 'rejected').length;
  const creators = new Set(allSubmissions.map(i => i.creator_id)).size;
  document.getElementById('s-creators').textContent = creators;
}

function filterItems(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderItems(status);
}

function renderItems(status) {
  const items = status === 'all' ? allSubmissions : allSubmissions.filter(i => i.status === status);
  const grid = document.getElementById('items-grid');
  if (!items.length) { grid.innerHTML = '<div class="empty">Keine Items in dieser Kategorie</div>'; return; }

  const rarityColors = { common: '#9ca3af', rare: '#3b82f6', epic: '#a855f7', legendary: '#FFB800' };

  grid.innerHTML = items.map(item => `
    <div class="review-card ${item.status === 'pending' ? 'pending' : ''}">
      ${item.image_url
        ? `<img src="${item.image_url}" class="review-img" onerror="this.style.display='none'" />`
        : `<div class="review-img-placeholder">🃏</div>`
      }
      <div class="review-body">
        <div class="creator-tag">
          <div class="creator-avatar">${(item.creator?.username || '?')[0].toUpperCase()}</div>
          <div>
            <div class="creator-name" style="color:#ccc;font-weight:600">@${item.creator?.username || 'Unbekannt'}</div>
            <div class="creator-name">${item.creator?.paypal_email || ''}</div>
          </div>
        </div>
        <div class="review-name">${item.name}</div>
        <div class="review-meta">
          <span class="badge badge-${item.rarity}">${item.rarity.toUpperCase()}</span>
          <span style="color:#555">${item.category}</span>
          <span style="color:#FFB800;font-weight:700"> · 🪙 ${item.suggested_price_bc} BC</span>
          <br>${new Date(item.created_at).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' })}
        </div>
        ${item.description ? `<div class="review-desc">"${item.description}"</div>` : ''}

        ${item.status === 'pending' ? `
          <div class="review-actions">
            <div class="price-row">
              <select class="rarity-select" id="rarity-${item.id}">
                <option value="common" ${item.rarity==='common'?'selected':''}>⚪ Common</option>
                <option value="rare" ${item.rarity==='rare'?'selected':''}>🔵 Rare</option>
                <option value="epic" ${item.rarity==='epic'?'selected':''}>🟣 Epic</option>
                <option value="legendary" ${item.rarity==='legendary'?'selected':''}>⭐ Legendary</option>
              </select>
              <select class="price-select" id="price-${item.id}">
                <option value="0">Gratis</option>
                <option value="50" ${item.suggested_price_bc===50?'selected':''}>🪙 50 BC</option>
                <option value="100" ${item.suggested_price_bc===100?'selected':''}>🪙 100 BC</option>
                <option value="200" ${item.suggested_price_bc===200?'selected':''}>🪙 200 BC</option>
                <option value="300" ${item.suggested_price_bc===300?'selected':''}>🪙 300 BC</option>
                <option value="500" ${item.suggested_price_bc===500?'selected':''}>🪙 500 BC</option>
                <option value="999" ${item.suggested_price_bc===999?'selected':''}>🪙 999 BC</option>
              </select>
            </div>
            <input class="note-input" id="note-${item.id}" placeholder="Notiz an Creator (optional)" />
            <div class="actions-row">
              <button class="btn btn-approve" onclick="reviewItem('${item.id}', 'approved')">✅ Genehmigen</button>
              <button class="btn btn-reject" onclick="reviewItem('${item.id}', 'rejected')">❌ Ablehnen</button>
            </div>
          </div>
        ` : `
          <div style="margin-top:12px">
            <span class="badge badge-${item.status}" style="padding:6px 14px;font-size:13px">
              ${item.status === 'approved' ? '✅ Genehmigt' : '❌ Abgelehnt'}
            </span>
            ${item.status === 'approved' ? `<span style="color:#22c55e;font-size:13px;margin-left:10px">🛒 ${item.sold_count || 0}x verkauft</span>` : ''}
            ${item.admin_note ? `<div style="margin-top:8px;padding:8px;background:#1a1a1a;border-radius:8px;font-size:12px;color:#888">💬 "${item.admin_note}"</div>` : ''}
          </div>
        `}
      </div>
    </div>
  `).join('');
}

async function reviewItem(id, status) {
  const rarity = document.getElementById('rarity-' + id)?.value;
  const price = parseInt(document.getElementById('price-' + id)?.value || 0);
  const note = document.getElementById('note-' + id)?.value || '';

  // Submission updaten
  await db.from('creator_submissions').update({ status, admin_note: note, reviewed_at: new Date().toISOString() }).eq('id', id);

  // Bei Genehmigung → direkt in items Tabelle einfügen
  if (status === 'approved') {
    const submission = allSubmissions.find(s => s.id === id);
    const { error } = await db.from('items').insert({
      name: submission.name,
      description: submission.description,
      emoji: '🃏',
      rarity: rarity || submission.rarity,
      category: submission.category,
      bc_cost: price,
      image_url: submission.image_url,
      is_active: true,
      battle_pass_only: false,
    });
    if (error) { showToast('DB Fehler: ' + error.message, true); return; }
    showToast('✅ Item genehmigt und im Shop veröffentlicht!');
  } else {
    showToast('❌ Item abgelehnt. Creator wurde benachrichtigt.');
  }

  loadAll();
}

function showToast(msg, error = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (error ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3500);
}

// Auto-login check
db.auth.getSession().then(async ({ data: { session } }) => {
  if (session) {
    const { data: profile } = await db.from('profiles').select('is_admin').eq('id', session.user.id).single();
    if (profile?.is_admin) { document.getElementById('auth-overlay').style.display = 'none'; loadAll(); }
  }
});
</script>
</body>
</html>
